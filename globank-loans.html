<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GloBank — модерация заявок</title>
<style>
:root{color-scheme:light;--blue:#155eef;--ink:#172033;--muted:#667085;--line:#e4e7ec;--bg:#f6f8fc}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head h2{font-size:22px;margin:0}.sub{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}.stat,.loan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 18px #182b4a08}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer;background:#edf2ff;color:#1849a9}.btn:disabled{opacity:.5;cursor:wait}.btn.active,.primary{background:var(--blue);color:white}.success{background:#dcfae6;color:#067647}.danger{background:#fee4e2;color:#b42318}.neutral{background:#f2f4f7;color:#344054}
.loan{margin-bottom:12px}.loan-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.loan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{min-width:0;overflow-wrap:anywhere}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.field div{font-weight:600;margin-top:3px}.status{display:inline-block;padding:4px 9px;border-radius:99px;background:#fff4cc;color:#93370d;font-size:12px;font-weight:700}.status.completed{background:#dcfae6;color:#067647}.status.rejected{background:#fee4e2;color:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.error{color:#b42318;background:#fff1f0;border:1px solid #fecdca;border-radius:12px;padding:12px}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
.modal{display:none;position:fixed;inset:0;background:#10182899;z-index:10;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modalbox{width:min(650px,100%);background:white;border-radius:20px;padding:20px}.modalbox canvas{display:block;width:100%;height:220px;border:2px dashed #cbd5e1;border-radius:12px;touch-action:none;margin:14px 0;background:#fff}
@media(max-width:520px){body{padding:10px}.loan{padding:12px}.head h2{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="head"><div><h2>🏦 GloBank · Заявки</h2><div class="sub">Модерация и подписание договоров · доступ только администраторам</div></div><button class="btn neutral" id="refreshBtn">↻ Обновить</button></header>
<div id="notice" class="sub" role="status" aria-live="polite">Проверка доступа…</div>
<div class="stats" id="stats"></div>
<nav class="filters" id="filters">
<button class="btn active" data-filter="pending">На модерации</button><button class="btn" data-filter="waiting_user_signature">Подпись клиента</button><button class="btn" data-filter="waiting_admin_signature">Подпись админа</button><button class="btn" data-filter="completed">Завершённые</button><button class="btn" data-filter="rejected">Отклонённые</button><button class="btn" data-filter="all">Все заявки</button>
</nav>
<main id="list"><div class="empty">Загрузка…</div></main>
<div class="modal" id="signatureModal" aria-hidden="true"><div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="sigTitle"><h3 id="sigTitle">Подпись администратора</h3><p class="sub">Убедитесь, что заявка прошла проверку, прежде чем подписывать договор.</p><canvas id="signatureCanvas" width="600" height="240"></canvas><div class="actions"><button class="btn neutral" id="clearSignature">Очистить</button><button class="btn success" id="saveSignature">Подписать договор</button><button class="btn neutral" id="closeSignature">Отмена</button></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,collection,query,where,orderBy,updateDoc} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyA6GGJxAiao77U7_9mBUEjftmS_FnSWbIw",authDomain:"glob-data.firebaseapp.com",projectId:"glob-data",storageBucket:"glob-data.firebasestorage.app",messagingSenderId:"122757049174",appId:"1:122757049174:web:ebb425edd0e1a8ea9a44f7"};
const app=initializeApp(firebaseConfig,"globankLoansAdmin");
const auth=getAuth(app),db=getFirestore(app);
let currentFilter="pending",currentLoanId=null,hasInk=false,allowed=false,loading=false;
const $=id=>document.getElementById(id);
const esc=value=>String(value??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=value=>{try{const d=value?.toDate?value.toDate():new Date(value);return value&&Number.isFinite(d.getTime())?d.toLocaleString("ru-RU"):"—"}catch{return "—"}};
const money=value=>Number.isFinite(Number(value))?Number(value).toLocaleString("ru-RU")+" ₽":"—";
const labels={pending:"На модерации",waiting_user_signature:"Ожидает подписи клиента",waiting_admin_signature:"Ожидает подписи администратора",completed:"Завершён",rejected:"Отклонён"};
function message(text,isError=false){$("notice").textContent=text;$("notice").style.color=isError?"#b42318":"#667085"}
function setBusy(value){loading=value;$("refreshBtn").disabled=value;document.querySelectorAll("#filters button").forEach(b=>b.disabled=value)}
async function loadLoans(filter=currentFilter){
 if(!allowed||loading)return;setBusy(true);$("list").innerHTML='<div class="empty">Загрузка заявок…</div>';
 try{
  let q=collection(db,"loans");
  q=filter==="all"?query(q,orderBy("createdAt","desc")):query(q,where("status","==",filter));
  const snap=await getDocs(q),loans=snap.docs.map(d=>({id:d.id,...d.data()}));
  const counts={pending:0,waiting_user_signature:0,waiting_admin_signature:0,completed:0,rejected:0};
  if(filter==="all")loans.forEach(l=>{if(counts[l.status]!==undefined)counts[l.status]++});else counts[filter]=loans.length;
  $("stats").innerHTML=[["На модерации",counts.pending],["Подпись клиента",counts.waiting_user_signature],["Подпись админа",counts.waiting_admin_signature],["Завершено",counts.completed],["Отклонено",counts.rejected]].map(([k,v])=>'<div class="stat"><strong>'+v+'</strong><span>'+k+'</span></div>').join("");
  if(!loans.length){$("list").innerHTML='<div class="empty">Заявок в этой категории пока нет.</div>';return}
  $("list").innerHTML=loans.map(l=>{
   const id=esc(l.id),status=esc(labels[l.status]||"Неизвестный статус");
   let actions="";
   if(l.status==="pending")actions+='<button class="btn success" data-action="approve" data-id="'+id+'">✓ Одобрить</button><button class="btn danger" data-action="reject" data-id="'+id+'">✕ Отказать</button>';
   if(l.status==="waiting_admin_signature")actions+='<button class="btn primary" data-action="sign" data-id="'+id+'">✍ Подписать договор</button>';
   if(!["completed","rejected"].includes(l.status)&&l.status!=="pending")actions+='<button class="btn danger" data-action="reject" data-id="'+id+'">Отказать</button>';
   return '<article class="loan"><div class="loan-top"><div><strong>'+esc(l.fullName)+'</strong><div class="sub">'+esc(l.userEmail)+'</div></div><div><span class="status '+esc(l.status)+'">'+status+'</span><div class="sub" style="margin-top:6px">'+date(l.createdAt)+'</div></div></div>'+
   '<div class="loan-grid">'+
   '<div class="field"><label>Global ID</label><div>'+esc(l.userGlobalId)+'</div></div>'+
   '<div class="field"><label>Телефон</label><div>'+esc(l.phoneNumber)+'</div></div>'+
   '<div class="field"><label>Сумма займа</label><div>'+money(l.amount)+'</div></div>'+
   '<div class="field"><label>Срок</label><div>'+esc(l.term)+' дней</div></div>'+
   '<div class="field"><label>К выплате</label><div>'+money(l.totalToPay)+'</div></div>'+
   '<div class="field"><label>Цель</label><div>'+esc(l.reason)+'</div></div>'+
   '<div class="field"><label>Карта для получения</label><div>'+esc(l.userCardNumber)+'</div></div>'+
   '<div class="field"><label>СНИЛС</label><div>'+esc(l.snils)+'</div></div>'+
   '</div>'+(l.rejectedReason?'<p><strong>Причина отказа:</strong> '+esc(l.rejectedReason)+'</p>':"")+
   (l.adminSignature?'<p class="sub">Подпись администратора сохранена.</p>':"")+'<div class="actions">'+actions+'</div></article>';
  }).join("");
 }catch(err){console.error(err);$("list").innerHTML='<div class="error">Не удалось загрузить заявки. Проверьте правила Firestore и индексы. '+esc(err.message)+'</div>'}
 finally{setBusy(false)}
}
async function actOnLoan(id,action){
 try{
  const ref=doc(db,"loans",id),snap=await getDoc(ref);
  if(!snap.exists())throw new Error("Заявка не найдена.");
  const loan=snap.data();
  if(action==="approve"){
   if(loan.status!=="pending")throw new Error("Статус заявки уже изменён.");
   if(!confirm("Одобрить заявку и отправить клиенту договор на подпись?"))return;
   await updateDoc(ref,{status:"waiting_user_signature"});
  }else{
   if(["completed","rejected"].includes(loan.status))throw new Error("Заявка уже закрыта.");
   const reason=(prompt("Укажите причину отказа:")||"").trim();
   if(!reason)return;if(reason.length>500)throw new Error("Причина должна быть не длиннее 500 символов.");
   if(!confirm("Отклонить заявку?"))return;
   await updateDoc(ref,{status:"rejected",rejectedReason:reason});
  }
  message("Изменения сохранены.");await loadLoans(currentFilter);
 }catch(err){message("Не удалось изменить заявку: "+err.message,true)}
}
$("list").addEventListener("click",e=>{const b=e.target.closest("button[data-action]");if(!b)return;const id=b.dataset.id;if(b.dataset.action==="approve")actOnLoan(id,"approve");else if(b.dataset.action==="reject")actOnLoan(id,"reject");else if(b.dataset.action==="sign")openSignature(id)});
$("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b||loading)return;currentFilter=b.dataset.filter;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("active",x===b));loadLoans(currentFilter)});
$("refreshBtn").addEventListener("click",()=>loadLoans());
const canvas=$("signatureCanvas"),ctx=canvas.getContext("2d");ctx.lineWidth=2.5;ctx.lineCap="round";ctx.strokeStyle="#102a56";let drawing=false;
function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener("pointerdown",e=>{drawing=true;hasInk=true;canvas.setPointerCapture(e.pointerId);const p=pointer(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=pointer(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
["pointerup","pointercancel","pointerleave"].forEach(n=>canvas.addEventListener(n,()=>drawing=false));
function openSignature(id){currentLoanId=id;hasInk=false;ctx.clearRect(0,0,canvas.width,canvas.height);$("signatureModal").classList.add("open");$("signatureModal").setAttribute("aria-hidden","false")}
$("clearSignature").addEventListener("click",()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false});
function closeSignature(){$("signatureModal").classList.remove("open");$("signatureModal").setAttribute("aria-hidden","true");currentLoanId=null}
$("closeSignature").addEventListener("click",closeSignature);
$("saveSignature").addEventListener("click",async()=>{
 if(!currentLoanId||!hasInk){message("Сначала поставьте подпись.",true);return}
 if(!confirm("Подписать договор и завершить заявку?"))return;
 const btn=$("saveSignature");btn.disabled=true;
 try{const ref=doc(db,"loans",currentLoanId),snap=await getDoc(ref);if(!snap.exists()||snap.data().status!=="waiting_admin_signature")throw new Error("Заявка больше не ожидает подписи.");
 await updateDoc(ref,{adminSignature:canvas.toDataURL("image/png"),status:"completed"});closeSignature();message("Договор подписан.");await loadLoans(currentFilter)
 }catch(err){message("Не удалось подписать договор: "+err.message,true)}finally{btn.disabled=false}
});
onAuthStateChanged(auth,async user=>{
 if(!user){message("Войдите в IT Global в основной админ-панели, затем откройте вкладку GloBank.",true);$("list").innerHTML='<div class="error">Нет активной сессии. Откройте админ-панель for_developers и войдите как администратор.</div>';return}
 try{const userSnap=await getDoc(doc(db,"users",user.uid));if(!userSnap.exists()||userSnap.data().role!=="admin"){message("Доступ запрещён: требуется роль admin.",true);$("list").innerHTML='<div class="error">Эта страница доступна только администраторам.</div>';return}
 allowed=true;message("Доступ подтверждён для администратора.");loadLoans()
 }catch(err){message("Не удалось проверить права доступа: "+err.message,true)}
});
</script>
</body>
</html>
