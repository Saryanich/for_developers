<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071225"><title>IT Global — Проверка доступа</title><link rel="icon" href="https://i.ibb.co/RkJWBxDb/i.webp">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#123768,#071225 48%,#030712);font-family:Inter,"Segoe UI",Arial,sans-serif;color:#edf6ff}.shell{width:min(100%,520px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}.brand img{width:48px;height:48px;border-radius:15px}.brand strong{font-size:22px}.panel{padding:clamp(22px,5vw,36px);border:1px solid #24466f;border-radius:26px;background:#09182eee;box-shadow:0 24px 80px #0006}h1{font-size:clamp(25px,5vw,32px);margin:0 0 10px;text-align:center}.lead{text-align:center;color:#b7cce7;line-height:1.6;margin:0 0 24px}label{display:block;margin:16px 0 8px;color:#c7dcf6;font-weight:600;font-size:14px}input{width:100%;padding:14px 15px;border:1px solid #365879;border-radius:13px;background:#061327;color:#fff;font:inherit;outline:none}input:focus{border-color:#46e5bd;box-shadow:0 0 0 3px #46e5bd1c}button{width:100%;border:0;border-radius:13px;padding:14px 16px;margin-top:16px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(100deg,#3b82f6,#16c9b5);color:#04111f}button:disabled{opacity:.6;cursor:wait}.secondary{background:#132a47;color:#d9eaff;border:1px solid #315276}#message{display:none;margin-top:18px;padding:15px;border-radius:13px;background:#102b3c;border:1px solid #315276;line-height:1.6;overflow-wrap:anywhere}.status{font-size:21px;font-weight:750;margin-bottom:8px}.muted{color:#a9c0dc;font-size:13px;line-height:1.6;margin-top:18px;text-align:center}.hidden{display:none!important}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="shell"><div class="brand"><img src="https://i.ibb.co/RkJWBxDb/i.webp" alt=""><strong>IT Global</strong></div><section class="panel"><h1>Проверка доступа</h1><p class="lead">Войдите через Global ID. Мы проверим, отправляли ли вы заявку, и покажем её текущий статус.</p><form id="loginForm"><label for="globalId">Global ID (22 символа)</label><input id="globalId" maxlength="22" minlength="22" autocomplete="username" required placeholder="Ваш Global ID"><label for="password">Пароль Global ID</label><input id="password" type="password" autocomplete="current-password" required placeholder="Пароль"><button id="loginButton" type="submit">Проверить заявку</button></form><div id="message" role="status" aria-live="polite"></div><button id="refreshButton" class="secondary hidden" type="button">Обновить статус</button><button id="logoutButton" class="secondary hidden" type="button">Выйти</button></section><p class="muted">Доступ к панели сотрудников предоставляется только после одобрения заявки администратором.</p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA6GGJxAiao77U7_9mBUEjftmS_FnSWbIw",authDomain:"glob-data.firebaseapp.com",projectId:"glob-data",storageBucket:"glob-data.firebasestorage.app",messagingSenderId:"122757049174",appId:"1:122757049174:web:ebb425edd0e1a8ea9a44f7"});
const auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserLocalPersistence);
const form=document.getElementById('loginForm'),button=document.getElementById('loginButton'),message=document.getElementById('message'),refresh=document.getElementById('refreshButton'),logout=document.getElementById('logoutButton');let verifiedGlobalId=null;
function show(title,detail,tone='info'){message.style.display='block';message.style.borderColor=tone==='success'?'#34d399':tone==='error'?'#fb7185':'#315276';message.replaceChildren();const h=document.createElement('div');h.className='status';h.textContent=title;const p=document.createElement('div');p.textContent=detail;message.append(h,p)}
async function check(){const user=auth.currentUser;if(!user||!verifiedGlobalId){show('Требуется вход','Войдите через Global ID, чтобы проверить заявку.','error');return}show('Проверяем заявку…','Сверяем авторизованный аккаунт с заявками.');refresh.disabled=true;try{const ps=await getDoc(doc(db,'users',user.uid));if(!ps.exists())throw Error('Профиль Global ID не найден.');const profile=ps.data();if(profile.globalId!==verifiedGlobalId)throw Error('Global ID не совпадает с профилем.');if(profile.globalIdAccess===false||profile.accountLocked===true)throw Error('Доступ к аккаунту отключён.');const qs=query(collection(db,'join_requests'),where('uid','==',user.uid));const snap=await getDocs(qs);const requests=snap.docs.map(d=>d.data()).filter(r=>r.globalId===verifiedGlobalId).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));if(!requests.length){show('Заявка не найдена','Для этого Global ID нет отправленной заявки. Доступ к панели сотрудников закрыт.','error');return}const status=String(requests[0].status||'pending').toLowerCase();if(['accepted','approved','hired'].includes(status)){show('Вы уже приняты! 🎉','Заявка одобрена. Перенаправляем в панель сотрудников…','success');setTimeout(()=>location.href='employee.html',1800)}else if(['rejected','declined'].includes(status)){show('Заявка отклонена','Администратор не одобрил заявку. Доступ к панели сотрудников закрыт.','error')}else{show('Заявка на рассмотрении','Ваша заявка найдена и ожидает решения администратора. Возвращайтесь позже и нажмите «Обновить статус».')}}catch(e){console.error(e);let detail=e?.message||'Не удалось проверить заявку.';if(String(e?.code||'').includes('permission-denied'))detail='Firestore запретил чтение заявки или профиля. Разрешите чтение только собственных заявок по uid == auth.uid.';show('Не удалось проверить доступ',detail,'error')}finally{refresh.disabled=false}}
form.addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('globalId').value.trim().replace(/\s+/g,''),password=document.getElementById('password').value;if(!/^[0-9a-zA-Z]{22}$/.test(id)){show('Некорректный Global ID','Нужно ровно 22 латинские буквы или цифры.','error');return}button.disabled=true;button.innerHTML='<span class="spinner"></span>Проверяем…';try{const mapSnap=await getDoc(doc(db,'global_ids',id)),mapping=mapSnap.exists()?mapSnap.data():null;if(!mapping||typeof mapping.email!=='string'||!mapping.email.includes('@'))throw Error('Global ID не найден или не привязан к почте.');const credential=await signInWithEmailAndPassword(auth,mapping.email.trim(),password),ps=await getDoc(doc(db,'users',credential.user.uid));if(!ps.exists()||ps.data().globalId!==id){await signOut(auth);throw Error('Global ID не совпадает с профилем аккаунта.')}if(ps.data().globalIdAccess===false||ps.data().accountLocked===true){await signOut(auth);throw Error('Доступ к аккаунту отключён.')}verifiedGlobalId=id;document.getElementById('password').value='';form.classList.add('hidden');refresh.classList.remove('hidden');logout.classList.remove('hidden');await check()}catch(e){console.error(e);let detail=e?.message||'Не удалось войти.';if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(e?.code))detail='Неверный Global ID или пароль.';if(String(e?.code||'').includes('permission-denied'))detail='Firebase запретил чтение Global ID или профиля. Проверьте правила Firestore.';show('Вход не выполнен',detail,'error')}finally{button.disabled=false;button.textContent='Проверить заявку'}});
refresh.addEventListener('click',check);logout.addEventListener('click',async()=>{await signOut(auth);verifiedGlobalId=null;form.classList.remove('hidden');refresh.classList.add('hidden');logout.classList.add('hidden');message.style.display='none'});
</script></body></html>
